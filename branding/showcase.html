<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDesktopLyrics — Logo Design Exploration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #0E0E12;
            color: #EDEDEF;
            overflow-x: hidden;
        }

        .font-mono {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        html {
            scroll-behavior: smooth;
        }

        .logo-card {
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-card:hover {
            transform: translateY(-4px);
        }

        .logo-canvas {
            position: relative;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-card:hover .logo-canvas {
            transform: scale(1.05) rotate(-2deg);
        }

        .logo-aura {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(138, 92, 246, 0.35) 0%, transparent 70%);
            border-radius: 50%;
            transform: scale(0.5);
            opacity: 0;
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            filter: blur(40px);
            pointer-events: none;
        }

        .logo-card:hover .logo-aura {
            transform: scale(1);
            opacity: 1;
        }

        .divider-line {
            width: 0;
            height: 1px;
            background: #8A5CF6;
            opacity: 0.5;
            transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-card:hover .divider-line {
            width: 100%;
        }

        .tracking-ultra-wide {
            letter-spacing: 0.2em;
        }

        .text-balance {
            text-wrap: balance;
        }

        svg {
            color: #F5F5F7;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const Variant01 = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="4" width="92" height="92" rx="22" fill="#16161E"/>
                <rect x="25" y="25" width="50" height="50" rx="12" fill="none" stroke="currentColor" strokeWidth="2.5"/>
                <circle cx="43" cy="60" r="8" fill="#8A5CF6"/>
                <line x1="51" y1="60" x2="51" y2="38" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
                <path d="M 51 39 C 58 37 62 43 61 52" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
            </svg>
        );

        const Variant02 = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="4" width="92" height="92" rx="22" fill="#16161E"/>
                <g fill="currentColor">
                    <circle cx="38" cy="62" r="3"/>
                    <circle cx="46" cy="58" r="3"/>
                    <circle cx="46" cy="66" r="3"/>
                    <circle cx="54" cy="62" r="3"/>
                    <circle cx="54" cy="52" r="3"/>
                    <circle cx="54" cy="42" r="3"/>
                    <circle cx="54" cy="32" r="3"/>
                    <circle cx="62" cy="36" r="2.5"/>
                    <circle cx="66" cy="44" r="2.5"/>
                </g>
                <circle cx="38" cy="62" r="3.5" fill="#8A5CF6"/>
            </svg>
        );

        const Variant03 = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="4" width="92" height="92" rx="22" fill="#16161E"/>
                <rect x="26" y="28" width="48" height="44" rx="11" fill="none" stroke="currentColor" strokeWidth="2.5"/>
                <rect x="36" y="52" width="6" height="12" rx="3" fill="currentColor"/>
                <rect x="46" y="44" width="6" height="20" rx="3" fill="currentColor"/>
                <rect x="56" y="48" width="6" height="16" rx="3" fill="#8A5CF6"/>
                <rect x="66" y="40" width="6" height="24" rx="3" fill="currentColor"/>
            </svg>
        );

        const Variant04 = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="4" width="92" height="92" rx="22" fill="#16161E"/>
                <circle cx="38" cy="60" r="8" fill="#8A5CF6"/>
                <line x1="46" y1="60" x2="46" y2="36" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
                <path d="M 46 37 C 53 35 57 41 56 50" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
                <path d="M 62 48 A 8 8 0 0 1 62 62" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" opacity="0.5"/>
                <path d="M 68 44 A 13 13 0 0 1 68 66" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" opacity="0.3"/>
            </svg>
        );

        const Variant05 = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="4" width="92" height="92" rx="22" fill="#16161E"/>
                <rect x="22" y="26" width="56" height="48" rx="12" fill="none" stroke="currentColor" strokeWidth="2.5"/>
                <rect x="34" y="40" width="26" height="6" rx="3" fill="currentColor" opacity="0.35"/>
                <rect x="34" y="54" width="20" height="6" rx="3" fill="currentColor" opacity="0.35"/>
                <rect x="56" y="54" width="16" height="6" rx="3" fill="#8A5CF6"/>
                <rect x="34" y="68" width="18" height="6" rx="3" fill="currentColor" opacity="0.2"/>
            </svg>
        );

        const Variant06 = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="4" width="92" height="92" rx="22" fill="#16161E"/>
                <rect x="22" y="34" width="52" height="44" rx="10" fill="none" stroke="currentColor" strokeWidth="2" opacity="0.25"/>
                <rect x="30" y="26" width="46" height="42" rx="10" fill="none" stroke="currentColor" strokeWidth="2.5"/>
                <rect x="40" y="42" width="24" height="5" rx="2.5" fill="currentColor" opacity="0.4"/>
                <rect x="40" y="53" width="16" height="5" rx="2.5" fill="#8A5CF6"/>
                <circle cx="66" cy="18" r="4" fill="#8A5CF6"/>
                <line x1="70" y1="18" x2="70" y2="10" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"/>
            </svg>
        );

        const Variant07 = () => (
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="4" width="92" height="92" rx="22" fill="#16161E"/>
                <circle cx="50" cy="50" r="32" fill="none" stroke="currentColor" strokeWidth="2.5"/>
                <circle cx="50" cy="50" r="22" fill="none" stroke="currentColor" strokeWidth="1.5" opacity="0.4"/>
                <circle cx="44" cy="56" r="7" fill="#8A5CF6"/>
                <line x1="51" y1="56" x2="51" y2="34" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
                <path d="M 51 35 C 58 33 61 39 60 47" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
                <circle cx="50" cy="50" r="4" fill="#8A5CF6"/>
            </svg>
        );

        const LogoShowcase = () => {
            const logos = [
                {
                    title: '悬浮音符',
                    subtitle: 'NOTE · WINDOW · PURE GEOMETRY',
                    philosophy: '圆形音符头与悬浮窗口外框的纯粹几何构成：窗口即桌面悬浮窗，音符即音乐。单点紫色强调色点题，负空间充足，16px 下依然清晰。'
                },
                {
                    title: '点阵音符',
                    subtitle: 'DOT MATRIX · MODULAR',
                    philosophy: '以点阵构成音符轮廓，呼应桌面歌词按字渲染的逐字结构。点阵的离散感映射歌词与时间的颗粒化，强调点为最高亮的一颗。'
                },
                {
                    title: '均衡器浮窗',
                    subtitle: 'LINE SYSTEM · AUDIO',
                    philosophy: '悬浮窗口内嵌入音频均衡器柱条：音乐节奏的直观可视化。紫色柱条打破对称，暗示「当前播放」的进行时，是最具动感的方案。'
                },
                {
                    title: '音符声波',
                    subtitle: 'LINES + GEOMETRY',
                    philosophy: '音符与声波弧线的结合，表现歌词随音乐流动、从窗口荡漾开来的意象。声波以不透明度递减形成纵深，简洁而有呼吸感。'
                },
                {
                    title: '卡拉OK高亮',
                    subtitle: 'KARAOKE · LYRIC BAR',
                    philosophy: '直指产品核心功能——逐字歌词高亮。三行歌词条中，第二行一半被紫色点亮，恰如卡拉OK进度。抽象克制，辨识度最高。'
                },
                {
                    title: '层叠悬浮窗',
                    subtitle: 'LAYERED · DESKTOP',
                    philosophy: '前景歌词窗叠在背景窗口之上，外溢一颗小音符，描绘「歌词窗口悬浮于桌面、音乐从中流出」的场景叙事，层次感强。'
                },
                {
                    title: '唱片音符',
                    subtitle: 'RECORD · CONCENTRIC',
                    philosophy: '同心圆唱片符号与音符融合，中央紫色圆心是唱针焦点。环形语言统一、结构稳定，适合强调品牌记忆点的正式场合。'
                }
            ];

            const variants = [Variant01, Variant02, Variant03, Variant04, Variant05, Variant06, Variant07];

            return (
                <div className="min-h-screen flex flex-col items-center py-20 px-6">

                    <div className="text-center mb-20 max-w-3xl">
                        <h1 className="text-5xl md:text-6xl font-extralight tracking-wider mb-6">
                            EasyDesktopLyrics
                        </h1>
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide mb-8">
                            Windows 桌面歌词 · 悬浮窗口 · 音乐同步
                        </p>
                        <div className="w-12 h-[1px] bg-[#8A5CF6] mx-auto opacity-60"></div>
                        <p className="mt-8 text-sm opacity-50 font-light leading-relaxed">
                            7 个方向探索 —— 请选择 2-3 个喜欢的编号，我将继续精修并落地为应用图标。
                        </p>
                    </div>

                    <div className="max-w-7xl w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16 mb-32">
                        {logos.map((logo, index) => {
                            const Variant = variants[index];
                            return (
                                <div key={index} className="flex flex-col items-center logo-card cursor-pointer">

                                    <div className="w-64 h-64 mb-10 flex items-center justify-center relative">
                                        <div className="logo-aura"></div>
                                        <div className="w-40 h-40 relative z-10 logo-canvas">
                                            <Variant />
                                        </div>
                                    </div>

                                    <div className="text-center w-full px-4">
                                        <span className="font-mono text-[10px] opacity-30 tracking-widest">VARIANT 0{index + 1}</span>
                                        <h2 className="text-xl font-medium tracking-wider mb-2 uppercase mt-2">
                                            {logo.title}
                                        </h2>
                                        <h3 className="text-xs font-mono opacity-50 tracking-widest mb-6">
                                            {logo.subtitle}
                                        </h3>
                                        <p className="text-sm leading-relaxed opacity-60 text-left font-light text-balance">
                                            {logo.philosophy}
                                        </p>
                                    </div>

                                    <div className="divider-line mt-8 mx-auto"></div>
                                </div>
                            );

                    </div>

                    <div className="mt-32 max-w-2xl text-center">
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide leading-loose">
                            Generated with Logo Generator<br/>
                            2026
                        </p>
                    </div>

                </div>
            );
        };

        ReactDOM.render(<LogoShowcase />, document.getElementById('root'));
    </script>

</body>
</html>
